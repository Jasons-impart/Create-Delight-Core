pluginManagement {
    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    name = 'NeoForge'
                    url = 'https://maven.neoforged.net/releases'
                }
            }
            filter {
                includeGroup 'net.neoforged'
                includeGroup 'net.neoforged.moddev'
            }
        }

        mavenLocal()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}
