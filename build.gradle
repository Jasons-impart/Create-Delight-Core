    implementation fg.deobf("curse.maven:createaddition-439890:5658602")
    // create utilities
    implementation fg.deobf("curse.maven:createutilities-881586:5225304")
    // lightmans currency
    implementation fg.deobf("curse.maven:lightmanscurrency-472521:6205400")
    // waystones
    implementation fg.deobf("curse.maven:balm-531761:6205942")
    implementation fg.deobf("curse.maven:waystones-245755:6156671")
    // create utilities
    implementation fg.deobf("curse.maven:createutilities-881586:5225304")

    // EclipticSeasons
    compileOnly fg.deobf("curse.maven:ecliptic-seasons-1118306:6399040")
    // quality foods
    implementation fg.deobf("curse.maven:quality_food-973932:6216348")

    // vinery
    implementation fg.deobf("curse.maven:vinery-704465:6264246")
    implementation fg.deobf("curse.maven:nethervinery-930072:6164515")
